# Read-only reviewer: no file edits, no shell, and no further delegation.
#
# Tool names here are DEPLOYMENT-specific. `write` and `edit` exist in every
# shipped composition; shell tools differ (the Windows headless profile exposes
# `pwsh`, the web profile may also expose `bash`/`terminal`, other platforms
# expose `bash`). A wrong name fails loud and lists the known ones:
#   Error: tools.restrict() names unknown global tools "bash"; known global tools: ...
# Uncomment and adjust for this deployment:
#   deny = ["write", "edit", "pwsh"]
name = "reviewer"
description = "只读代码审查：只报告问题，不修改任何文件，不再向下委派。"
provider = "spawn"
mode = "one-shot"
persona = """
你是资深代码审查者。只报告问题与依据，不修改文件；需要改动时在结论里说明建议。
"""
# Caps the CHILD's absolute depth: 1 allows this delegation and rejects any
# delegation the child would try to make (its own child would be depth 2 > 1).
max_depth = 1

[tools]
deny = ["write", "edit"]
