# 示例 1：可继续的轻量探索子代理
#
# 演示：mode = "continuable"（拿到子代理 id 后可反复追问）+ 子代理模型路由（跑在便宜快的模型上）
#      + agent_preset（子代理的人设与工具集交给一个 Agent Preset）。
#
# 用法：复制到 $DSH_HOME/agents/ 或已信任的 <项目根>/.dsh/agents/，下一次委派即可用
#      agent_type = "explorer"（无需重启）。
#
# 注释约定：
#   [必填] 缺少会让该定义在解析期失败（其余定义不受影响）
#   [可选] 省略时按括号里的默认行为执行
# 每个键的类型、可选项与能力要求见 README 的「TOML 字段参考」。

# [必填] agent_type 的取值；须匹配 [A-Za-z0-9][A-Za-z0-9_-]{0,63}
name = "explorer"

# [必填] 非空。模型据此决定何时选它，写清"什么时候该用"
description = "代码库探索与定位：快速找文件、找符号、回答结构性问题。"

# [可选] 默认 true。false 时不会出现在 agent_type 列表与工具描述里，显式调用报 "is disabled"
enabled = true

# [可选] 默认 "one-shot"。continuable = 立即返回 `started subagent <childId>`
#        （入队被接受即返回，这就是本次调用的全部返回值，**结论不在里面**）。
#        子代理收尾时，宿主会把它的**最终输出文本**作为一条结算通知投递给父会话：
#          Background subagent <id> finished and will do no further work unless you send it more.
#          Its closing message:
#          <子代理最后的文本>
#        父会话空闲会被唤醒。**只回传收尾消息的文本**：中途的工具输出、推理都不在其中 ——
#        所以要子代理把结论写在最后一条消息里，就在它选用的 Agent Preset 的 persona 里写明
#        （见下面 agent_preset 一行；preset 里的 dsh-persona 会写进子代理的系统提示）。
#        中途那条与收尾那条形态不同，不要混判：中途由子代理主动 send_message，父会话看到
#        `Agent <子代理id> sent a message:` + 正文（只表示"还在跑，先报一件事"）；收尾由宿主
#        自动投递 `Background subagent <id> finished …` + `Its closing message:`。要求中途提前
#        告知时，务必写明**只发增量**，否则子代理会把整份结论中途也发一遍，父会话收到两份重叠内容。
#        续聊要用官方 `dsh-tool-subagent-control` 的 send_message（参数是 agent_id，
#        只授权直接父子之间）；若该 profile 启用了 Agent Teams，headless 档下这个控制工具
#        会被禁用（换成按 target 寻址队友的同名工具），web 档下则可能因官方 preset 重挂
#        而仍在 —— 但上面的结算通知**两档都不受影响**，仍会送达。另外本插件起的子代理
#        不在团队花名册上，团队的消息/中断/清理不覆盖它（详见 README 该节）。
mode = "continuable"

# [可选] 默认取插件行 defaultProvider（默认 spawn）。
#        可用值取决于该 profile 注册了哪些 provider（官方示例：spawn / fork / acp / codex / claude-code / dsh-sdk）
provider = "spawn"

# --- 可选：子代理自己的模型路由（需要 provider 能力 agentOptions：spawn / fork / dsh-sdk）---
# 让探索跑在便宜快的模型上，父会话继续用主模型
llm_provider = "deepseek-official"
model = "deepseek-v4-flash"
# reasoning_effort = "low"    # 可选：推理档位（off/low/high/max，随 provider 而定）
# max_tokens = 8192           # 可选：正整数，子代理单次生成上限

# [可选] 让这个子代理整体套用一个 Agent Preset（需要 provider 能力 agentPreset 且该 provider
#        不继承父上下文 —— spawn 可以，fork 不行；并且该 profile 要挂载 agent-presets 服务，
#        随发行版的 web 组合有、headless 组合没有）。
#        dsh 0.2.1 起**不再有**逐子代理的 persona 与 [tools] 字段：子代理的人设和工具集都由它选用的
#        preset 决定（preset 里放一个 @deepseek-ai/dsh-persona 行就是人设，放哪些工具插件行就是工具集）。
#        写法见 guide/migrating-to-0.4.md；这里假设 profile 里已声明了 id 为 "explorer" 的 preset。
agent_preset = "explorer"

# [可选] 省略则取 Host 的 subagent.maxDepth（通常为 1）。
#        语义：约束"本定义创建出的子代理"的绝对深度 —— 1 = 允许本次委派，但它不能再往下委派。
#        0 永远不成立（子代理深度至少为 1），因此在解析期就判失败。
#        注意：Harness 要求"请求里带 maxDepth 就必须由具备 depthLimit 的 provider 执行"，
#        所以本插件只在 provider 支持 depthLimit 时才下发 Host 的隐式上限；写了本行则一定下发，
#        在不支持的 provider（如 acp/codex）上会明确报"不支持深度上限"。
max_depth = 1

# --- 已移除的键（0.4.0 起写了就会让本文件在解析期失败，并给出迁移提示）---
# [tools] deny = ["write", "edit"]
#   dsh 0.2.1 删掉了逐子代理的工具过滤，官方也没有提供替代字段。要"只读子代理"，
#   就做一个只挂读工具的 preset，用上面的 agent_preset 指过去。
# persona = """..."""
#   同样在 dsh 0.2.1 被删除；改在 preset 里放一个 @deepseek-ai/dsh-persona 行。

# --- 本例未启用的可选键（按需取消注释，注意括号里的约束）---
# output_schema = { type = "object", properties = { summary = { type = "string" } }, required = ["summary"] }
# ↑ 让子代理返回结构化结果（需要 provider 能力 outputSchema），且**只能**配 mode = "one-shot"，
#   与本文件上面的 continuable 互斥。
