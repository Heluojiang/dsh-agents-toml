# 示例 2：只读代码审查子代理
#
# 演示：mode = "one-shot"（等它跑完并拿回结果）+ 结构化返回 + agent_preset（人设与"只读工具集"
#      都由 preset 决定）。
#
# 用法：复制到 $DSH_HOME/agents/ 或已信任的 <项目根>/.dsh/agents/，下一次委派即可用
#      agent_type = "reviewer"（无需重启）。
#
# 注释约定：
#   [必填] 缺少会让该定义在解析期失败（其余定义不受影响）
#   [可选] 省略时按括号里的默认行为执行
# 每个键的类型、可选项与能力要求见 README 的「TOML 字段参考」。

# [必填] agent_type 的取值；须匹配 [A-Za-z0-9][A-Za-z0-9_-]{0,63}
name = "reviewer"

# [必填] 非空。模型据此决定何时选它
description = "只读代码审查：只报告问题与依据，不修改任何文件，不再向下委派。"

# [可选] 默认 true。false 时不会出现在 agent_type 列表里，显式调用报 "is disabled"
enabled = true

# [可选] 默认 "one-shot"。one-shot = 父会话等待子代理完成后拿回最终文本；
#        continuable 相反（立即返回子代理 id）。本例要"当场拿到审查结论"，所以用默认值。
mode = "one-shot"

# [可选] 默认取插件行 defaultProvider（默认 spawn）。spawn 不继承父对话上下文，
#        因此 prompt 必须自包含（本插件的工具描述也这样提示模型）。
#        只有既支持 agentPreset 能力、又不继承父上下文的 provider 才能选 preset ——
#        spawn 可以，fork 会在委派时报"不支持独立 preset 选择"。
provider = "spawn"

# [可选] 让这个子代理整体套用一个 Agent Preset（需要该 profile 挂载 agent-presets 服务）。
#        dsh 0.2.1 起**不再有**逐子代理的 persona 与 [tools] 字段：这个子代理的人设和它能用的工具，
#        都由它选用的 preset 决定。本例假设 profile 里已声明了 id 为 "reviewer" 的 preset，
#        它的 plugins 里有一个 @deepseek-ai/dsh-persona 行（写下面的审查者人设）和一组只读工具行
#        （不再挂 write / edit）。完整写法见 guide/migrating-to-0.4.md。
agent_preset = "reviewer"

# [可选] 省略则取 Host 的 subagent.maxDepth（通常为 1）。
#        1 = 允许本次委派，但该子代理不能再往下委派（它的子代理深度会是 2 > 1）。
max_depth = 1

# [可选] 结构化返回：父会话收到的是**符合该 schema 的 JSON 文本**（需要 provider 能力 outputSchema，
#        且只能配 mode = "one-shot"）。删掉本行则返回子代理的最终文本。
#        注意：Harness 会给这类子代理下"必须用结构化工具交值、不要以纯文本收尾"的指令，
#        所以它的最终文本通常是空的 —— 真正的结论就在这段 JSON 里。想同时要一段散文总结，
#        就在 agent_preset 选用的那个 preset 的 persona 行里另外要求它写。
output_schema = { type = "object", properties = { summary = { type = "string" }, findings = { type = "array", items = { type = "string" } } }, required = ["summary"] }

# --- 已移除的键（0.4.0 起写了就会让本文件在解析期失败，并给出迁移提示）---
# persona = """..."""
#   dsh 0.2.1 删掉了逐子代理 persona：改在 agent_preset 选用的 preset 里放一个
#   @deepseek-ai/dsh-persona 行（config.prefix 就是那段人设文本）。
# [tools] deny = ["write", "edit"]
#   dsh 0.2.1 也删掉了逐子代理工具过滤，官方没有提供替代字段 —— 唯一等价做法是让 preset
#   只挂该子代理能用的那些工具插件行（例如不挂 write/edit），也就是"一个工具集合一个 preset"。

# --- 本例未启用的可选键（按需取消注释，注意括号里的约束）---
# 把审查也放到另一个模型上（需要 provider 能力 agentOptions：spawn / fork / dsh-sdk）：
# llm_provider = "deepseek-official"
# model = "deepseek-v4-flash"
# reasoning_effort = "high"
# max_tokens = 8192
